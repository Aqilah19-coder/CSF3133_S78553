<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Student Grade Calculator</h2>

    <!-- Student grade form -->
    <form name="gradeForm" onsubmit="return checkMark()">

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br>

        <label for="mark">Mark (0-100):</label><br>
        <input type="text" id="mark" name="mark"><br>

        <button type="submit">Check Grade</button>

        <!-- Random Mark button -->
        <button type="button" onclick="randomMark()">
            Random Mark
        </button>
    </form>

    <!-- Display result -->
    <p id="result"></p>

    <!-- Display date and time -->
    <p id="checkTime"></p>

    <!-- Display grade table -->
    <button onclick="showTable()">Show Grade Table</button>

    <div id="tableContainer"></div>

    <!-- External JavaScript -->
    <script src="grade.js"></script>

</body>
</html>
